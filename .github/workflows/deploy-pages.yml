name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'llm_dashboard/dashboard/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，新的推送会取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement 让首次运行时自动开启仓库的 Pages 功能，无需手动在设置页配置
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: llm_dashboard/dashboard

      - id: deployment
        uses: actions/deploy-pages@v4