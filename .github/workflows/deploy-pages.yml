name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'llm_dashboard/dashboard/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，新的推送会取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages 站点需在仓库 Settings → Pages 中将 Source 设为 "GitHub Actions" 手动开启一次；
      # 移除 configure-pages 的 enablement，避免令牌创建站点时返回 Resource not accessible 报错
      - uses: actions/upload-pages-artifact@v3
        with:
          path: llm_dashboard/dashboard

      - id: deployment
        uses: actions/deploy-pages@v4